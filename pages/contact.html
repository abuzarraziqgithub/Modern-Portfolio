<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Abuzar</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./style/contact.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Primary">
            <a class="brand" href="../index.html" aria-label="Abuzar RaziQ home">
                <img src="../images/Logo.png" alt="Abuzar RaziQ logo" loading="eager" decoding="async" fetchpriority="high">
            </a>
            <button class="ham-menu" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-panel active" id="primary-nav">
                <a class="nav-link" href="../index.html#home">Home</a>
                <a class="nav-link" href="../index.html#about">About</a>
                <a class="nav-link" href="../index.html#work">Work</a>
                <a class="nav-link is-active" href="./contact.html">Contact</a>
            </div>
            <a class="talk-button" href="mailto:labuzarraziq@gmail.com">Let's talk</a>
        </nav>
    </header>

    <main class="contact-page">
        <section class="section-shell contact-layout">
            <aside class="contact-panel glass-panel reveal">
                <p class="eyebrow">Contact</p>
                <h1>Let’s make the next project feel lighter, cleaner, and easier to ship.</h1>
                <div class="contact-list">
                    <a href="mailto:labuzarraziq@gmail.com">
                        <span>Email</span>
                        <strong>labuzarraziq@gmail.com</strong>
                    </a>
                    <a href="tel:+923276088249">
                        <span>Phone</span>
                        <strong>03276088249</strong>
                    </a>
                    <div>
                        <span>Location</span>
                        <strong>Hostel City, Islamabad, Pakistan</strong>
                    </div>
                </div>
            </aside>

            <section class="form-panel glass-panel reveal">
                <div class="form-header">
                    <img src="../images/contact-icons.png" alt="Contact illustration" loading="eager" decoding="async" fetchpriority="high">
                    <div>
                        <p class="eyebrow">Quick brief</p>
                        <h2>Send a message</h2>
                    </div>
                </div>
                <form action="mailto:labuzarraziq@gmail.com" method="post">
                    <label>
                        <span>Name</span>
                        <input type="text" name="name" placeholder="Your name" required>
                    </label>
                    <label>
                        <span>Email</span>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </label>
                    <label>
                        <span>Subject</span>
                        <input type="text" name="subject" placeholder="Project idea">
                    </label>
                    <label>
                        <span>Message</span>
                        <textarea name="message" rows="7" placeholder="Tell me about the project" required></textarea>
                    </label>
                    <button type="submit" class="primary-action">Send Message</button>
                </form>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <div class="section-shell footer-inner glass-panel">
            <img src="../images/Logo.png" alt="Abuzar RaziQ logo" loading="lazy" decoding="async">
            <p>Copyright © 2026. All rights reserved by Abuzar RaziQ.</p>
        </div>
    </footer>

    <script src="../index.js"></script>
</body>
</html>
